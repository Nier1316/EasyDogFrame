# 所有路径均使用相对于项目根目录的路径，确保在其他电脑上可直接运行
paths:
  scene_xml: "config/robot/bigdog/xml/scene.xml"
  policy_path: "config/policy.pt"

joint_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FL_wheel_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FR_wheel_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RL_wheel_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RR_wheel_joint

#轮子对应关节的序号
wheel_ids: [3, 7, 11, 15]

default_dof_pos: [0.0, 0.0, 0.0, 0.0]  #初始关节角度
stand_dof_pos:   [0.0, 0.0, 0.0, 0.0]  #站立关节角度

p_gains: [70.0, 70.0, 70.0, 0.0]  #kp
d_gains: [2.0, 2.0, 2.0, 0.5]  #kd
#下面这些是归一化需要的参数，需要严格与训练时的参数对齐，下面的是对其了的
actions_scale: 0.25
vel_scale: 10.0
yaw_kp: 2.5

scale_factors:
  scale_lin_vel: 2.0
  scale_ang_vel: 0.25
  scale_dof_pos: 1.0
  scale_dof_vel: 0.05
  scale_height: 2.0

height_range: [-0.15, 0.15]
#仿真相关参数
sim_steps_per_loop: 4
timestep: 0.002
base_height_target: 0.55
